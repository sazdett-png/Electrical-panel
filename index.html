<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Panel Schedule</title>
    <style>
        /* Темна тема */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #121212;
            color: #e0e0e0;
            font-size: 13px;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        button {
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
            font-weight: bold;
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #555;
            border-radius: 4px;
            transition: background 0.2s;
        }
        button:hover { background-color: #3d3d3d; }
        
        .panel-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 10px;
            background-color: #181818;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* МАГІЯ CSS GRID: 10 колонок для ідеального об'єднання */
        .panel-grid {
            display: grid;
            grid-template-columns: 2fr 4.5fr 1.2fr 1.3fr 1fr   1fr 1.3fr 1.2fr 4.5fr 2fr;
            background-color: #444; /* Колір ліній сітки (через gap) */
            gap: 1px;
            border: 2px solid #555;
            border-radius: 4px;
            overflow: hidden;
        }

        .cell {
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            position: relative;
        }

        .header {
            background-color: #2a2a2a;
            font-weight: bold;
            padding: 10px 5px;
            text-align: center;
        }

        .cell-num { font-weight: bold; background-color: #252525; }
        .phase-blue { background-color: #1a4b6b !important; color: #fff; }

        input[type="text"], select {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: none;
            padding: 8px 5px;
            font-family: inherit;
            background: transparent;
            color: inherit;
            text-align: center;
        }
        
        /* Вирівнювання тексту опису і проводу наліво для зручності */
        .cell-desc input, .cell-wire input { text-align: left; padding-left: 10px; }
        
        input[type="text"]:focus, select:focus {
            outline: 2px solid #00aaff;
            background-color: rgba(255, 255, 255, 0.05);
            z-index: 10;
        }
        
        select option { background-color: #2c2c2c; color: #e0e0e0; }

        /* КОЛЬОРИ АВТОМАТІВ (Amperage Colors) */
        .amp-15A { background-color: #1e1e1e; color: #e0e0e0; }
        .amp-20A { background-color: #b89300; color: #000; font-weight: bold; } /* Жовтий */
        .amp-30A { background-color: #2e7d32; color: #fff; font-weight: bold; } /* Зелений */
        .amp-40A { background-color: #e65100; color: #fff; font-weight: bold; } /* Помаранчевий */
        .amp-50A { background-color: #c62828; color: #fff; font-weight: bold; } /* Червоний */
        .amp-60A { background-color: #6a1b9a; color: #fff; font-weight: bold; } /* Фіолетовий */
        .amp-70A { background-color: #ad1457; color: #fff; font-weight: bold; } /* Рожевий */
        .amp-90A { background-color: #00838f; color: #fff; font-weight: bold; } /* Бірюзовий */
        .amp-100A{ background-color: #283593; color: #fff; font-weight: bold; } /* Темно-синій */
        .amp-SPACE{ background-color: #333333; color: #888; }

        /* Стилі для об'єднаних комірок */
        .merged-cell select {
            cursor: pointer;
        }

        .is-slave input { color: #666; }
        .is-slave { background-color: #181818; }
        .slave-linked-text {
            font-size: 0.8em;
            color: #666;
            font-style: italic;
            pointer-events: none;
            position: absolute;
            right: 10px;
        }

        .action-buttons { text-align: center; margin-top: 20px; }
        .btn-add { background-color: #1e5a22; border-color: #2a7a2f; }
        .btn-add:hover { background-color: #2a7a2f; }
        .btn-remove { background-color: #6b2222; border-color: #8c2d2d; }
        .btn-remove:hover { background-color: #8c2d2d; }
        .btn-print { background-color: #005577; border-color: #0077aa; margin-left: 20px; }
        .btn-print:hover { background-color: #0077aa; }

        /* Світла тема для ідеального ДРУКУ */
        @media print {
            body { background-color: white; color: black; margin: 0; font-size: 11px; }
            .controls, .action-buttons, .slave-linked-text { display: none; }
            .panel-container { background-color: transparent; box-shadow: none; padding: 0; max-width: 100%; }
            .panel-grid { background-color: #000; border: 2px solid #000; gap: 1px; }
            .cell { background-color: white; color: black; }
            .header { background-color: #ddd; }
            
            input[type="text"], select { color: black; font-weight: 600; }
            select { appearance: none; -webkit-appearance: none; text-align: center; }
            
            .cell-num { background-color: #f4f4f4; }
            .is-slave { background-color: #fafafa !important; }

            /* Яскраві кольори автоматів для друку */
            * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .phase-blue { background-color: #00aaff !important; color: white !important; }
            .amp-15A { background-color: white !important; color: black !important; }
            .amp-20A { background-color: #ffeb3b !important; color: black !important; }
            .amp-30A { background-color: #81c784 !important; color: black !important; }
            .amp-40A { background-color: #ffb74d !important; color: black !important; }
            .amp-50A { background-color: #e57373 !important; color: black !important; }
            .amp-60A { background-color: #ba68c8 !important; color: black !important; }
            .amp-70A { background-color: #f06292 !important; color: black !important; }
            .amp-90A { background-color: #4dd0e1 !important; color: black !important; }
            .amp-100A{ background-color: #7986cb !important; color: black !important; }
            .amp-SPACE{ background-color: #e0e0e0 !important; color: #666 !important; }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <button onclick="setLang('uk')">🇺🇦 Українська</button>
        <button onclick="setLang('en')">🇬🇧 English</button>
        <button class="btn-print" onclick="window.print()">🖨️ Друк / Print</button>
    </div>

    <div class="panel-container">
        <!-- Уся таблиця рендериться всередині цього грід-контейнера -->
        <div class="panel-grid" id="panel-grid"></div>
    </div>

    <div class="action-buttons no-print">
        <button class="btn-add" onclick="addRow(true)" id="btn-add">➕ Додати ряд</button>
        <button class="btn-remove" onclick="removeRow()" id="btn-remove">➖ Видалити ряд</button>
    </div>

    <script>
        const i18n = {
            uk: { wire: "Провід", desc: "Опис ланцюга", amps: "Струм", poles: "Полюси", add: "➕ Додати ряд", remove: "➖ Видалити ряд" },
            en: { wire: "Wire", desc: "Description", amps: "Amps", poles: "Poles", add: "➕ Add Row", remove: "➖ Remove Row" }
        };

        let currentLang = 'uk';
        let panelData = {};
        let totalRows = 0; 

        const ampOptions = ["15A", "20A", "30A", "40A", "50A", "60A", "70A", "90A", "100A", "SPACE"];

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-add').innerText = i18n[lang].add;
            document.getElementById('btn-remove').innerText = i18n[lang].remove;
            renderPanel();
        }

        function addRow(shouldRender = true) {
            totalRows++;
            let leftId = (totalRows * 2) - 1;
            let rightId = totalRows * 2;
            
            panelData[leftId] = { desc: '', amps: '15A', wire: '', poles: 1, master: null };
            panelData[rightId] = { desc: '', amps: '15A', wire: '', poles: 1, master: null };
            
            if (shouldRender) renderPanel();
        }

        function removeRow() {
            if (totalRows === 0) return;
            let leftId = (totalRows * 2) - 1;
            let rightId = totalRows * 2;
            
            delete panelData[leftId];
            delete panelData[rightId];
            
            totalRows--;
            renderPanel();
        }

        function handlePoleChange(id, value) {
            let poles = parseInt(value);
            
            for (let i in panelData) {
                if (panelData[i].master === id) panelData[i].master = null;
            }

            panelData[id].poles = poles;

            // Якщо вибрали більше полюсів — створюємо додаткові ряди, якщо їх ще немає
            let maxNeededId = id + ((poles - 1) * 2); 
            let neededRows = Math.ceil(maxNeededId / 2);
            while (totalRows < neededRows) { addRow(false); }

            if (poles > 1) {
                let slave1 = id + 2;
                panelData[slave1].master = id;
                panelData[slave1].poles = 1; 
            }
            if (poles > 2) {
                let slave2 = id + 4;
                panelData[slave2].master = id;
                panelData[slave2].poles = 1;
            }
            renderPanel();
        }

        function updateData(id, field, value) {
            panelData[id][field] = value;
            if(field === 'amps') {
                for (let i in panelData) {
                    if (panelData[i].master === id) panelData[i].amps = value;
                }
                renderPanel(); 
            }
        }

        function renderPanel() {
            let html = "";

            // Рендер Шапки (Header)
            if (totalRows > 0) {
                html += `
                    <div class="cell header" style="grid-column: 1; grid-row: 1;">${i18n[currentLang].wire}</div>
                    <div class="cell header" style="grid-column: 2; grid-row: 1;">${i18n[currentLang].desc}</div>
                    <div class="cell header" style="grid-column: 3; grid-row: 1;">${i18n[currentLang].amps}</div>
                    <div class="cell header" style="grid-column: 4; grid-row: 1;">${i18n[currentLang].poles}</div>
                    <div class="cell header" style="grid-column: 5; grid-row: 1;">#</div>
                    
                    <div class="cell header" style="grid-column: 6; grid-row: 1;">#</div>
                    <div class="cell header" style="grid-column: 7; grid-row: 1;">${i18n[currentLang].poles}</div>
                    <div class="cell header" style="grid-column: 8; grid-row: 1;">${i18n[currentLang].amps}</div>
                    <div class="cell header" style="grid-column: 9; grid-row: 1;">${i18n[currentLang].desc}</div>
                    <div class="cell header" style="grid-column: 10; grid-row: 1;">${i18n[currentLang].wire}</div>
                `;
            } else {
                html = `<div style="grid-column: 1 / span 10; padding: 50px; text-align:center; color: #888;">
                            ${currentLang === 'uk' ? 'Щит порожній. Додайте ряди кнопкою нижче.' : 'Panel is empty. Add rows below.'}
                        </div>`;
            }

            // Рендер Автоматів
            for (let i = 1; i <= totalRows * 2; i++) {
                let data = panelData[i];
                let rowNum = Math.ceil(i / 2) + 1; // +1 бо перший ряд це шапка
                let isLeft = (i % 2 !== 0);
                
                let isSlave = data.master !== null;
                let poles = data.poles;
                
                let isBlue = ((rowNum - 1) % 3 === 0);
                let numClass = isBlue ? "cell cell-num phase-blue" : "cell cell-num";

                let colWire = isLeft ? 1 : 10;
                let colDesc = isLeft ? 2 : 9;
                let colAmps = isLeft ? 3 : 8;
                let colPoles= isLeft ? 4 : 7;
                let colNum  = isLeft ? 5 : 6;

                // Базові поля: Провід, Опис, Номер
                let slaveClass = isSlave ? "is-slave" : "";
                let slaveText = isSlave ? `<span class="slave-linked-text">↓ linked</span>` : "";
                
                html += `
                    <div class="cell cell-wire ${slaveClass}" style="grid-column: ${colWire}; grid-row: ${rowNum};">
                        <input type="text" value="${data.wire}" onchange="updateData(${i}, 'wire', this.value)" ${isSlave ? 'disabled' : ''}>
                    </div>
                    <div class="cell cell-desc ${slaveClass}" style="grid-column: ${colDesc}; grid-row: ${rowNum};">
                        <input type="text" value="${data.desc}" onchange="updateData(${i}, 'desc', this.value)" ${isSlave ? 'disabled' : ''}>
                        ${slaveText}
                    </div>
                    <div class="${numClass}" style="grid-column: ${colNum}; grid-row: ${rowNum};">${i}</div>
                `;

                // Поля Струму та Полюсів (рендеряться тільки якщо це майстер-автомат)
                if (!isSlave) {
                    let rowSpan = poles > 1 ? ` / span ${poles}` : "";
                    let fontSize = poles === 1 ? '1em' : (poles === 2 ? '1.4em' : '1.8em');
                    let ampClass = `cell amp-${data.amps} ${poles > 1 ? 'merged-cell' : ''}`;
                    
                    let ampSelect = `<select onchange="updateData(${i}, 'amps', this.value)" style="font-size: ${fontSize};">`;
                    ampOptions.forEach(opt => {
                        let selected = (data.amps === opt) ? "selected" : "";
                        ampSelect += `<option value="${opt}" ${selected}>${opt}</option>`;
                    });
                    ampSelect += `</select>`;

                    let poleSelect = `<select onchange="handlePoleChange(${i}, this.value)" style="font-size: ${fontSize};">
                        <option value="1" ${poles == 1 ? 'selected' : ''}>1 Pole</option>
                        <option value="2" ${poles == 2 ? 'selected' : ''}>2 Pole</option>
                        <option value="3" ${poles == 3 ? 'selected' : ''}>3 Pole</option>
                    </select>`;

                    html += `
                        <div class="${ampClass}" style="grid-column: ${colAmps}; grid-row: ${rowNum}${rowSpan};">
                            ${ampSelect}
                        </div>
                        <div class="cell ${poles > 1 ? 'merged-cell' : ''}" style="grid-column: ${colPoles}; grid-row: ${rowNum}${rowSpan};">
                            ${poleSelect}
                        </div>
                    `;
                }
            }

            document.getElementById('panel-grid').innerHTML = html;
        }

        // Запуск
        setLang(currentLang);

    </script>
</body>
</html>
